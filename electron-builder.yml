# electron-builder 配置 —— 三平台桌面安装包
#
# 构建（在各自平台上跑最稳；CI 里三个 runner 分别构建）：
#   npm ci
#   npm run dist:win      # Windows  → nsis 安装包 + portable 单文件 exe
#   npm run dist:linux    # Linux    → AppImage + deb
#   npm run dist:mac      # macOS    → dmg + zip（x64 / arm64）
#
# ⚠️ asar: false 是**必须的**：
#   桌面外壳把面板作为子进程启动（ELECTRON_RUN_AS_NODE=1），
#   而 ELECTRON_RUN_AS_NODE 是纯 Node 语义，**读不到 asar 里的文件**。
#   关掉 asar 后所有 .mjs 都是真实文件，相对路径、子进程、spawn 内核都正常。

appId: io.github.suimi8.opencode-free-gateway
productName: OpenCode-Free-Gateway
copyright: MIT © 2026 suimi8

asar: false

directories:
  output: dist-desktop
  buildResources: build

files:
  - package.json
  - desktop/**
  - 01-管理面板/**
  - 10-代理节点管理/*.mjs
  - 10-代理节点管理/*.yaml
  - 10-代理节点管理/*.json
  - build/icon.png
  # 绝不打进安装包的东西
  - "!**/*.db"
  - "!**/*.db-wal"
  - "!**/*.db-shm"
  - "!**/*.log"
  - "!**/.secret"
  - "!**/.testkey"
  - "!**/subscriptions.json"
  - "!**/runtime/**"
  - "!**/mihomo-config/**"
  - "!**/node_modules/**"
  - "!**/*.exe"
  - "!**/*.ps1"
  - "!**/*.cmd"
  - "!**/*.sh"

# ── Windows ──
# 只产出**单文件便携 exe**：双击即用，不安装、不写注册表。
# （早期同时配了 nsis + portable，两者默认同名，portable 会把安装包覆盖掉。
#   要安装包就单独跑：npx electron-builder --win nsis）
win:
  icon: build/icon.png
  target:
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-win-${arch}.${ext}

# ── Linux ──
linux:
  icon: build/icon.png
  category: Network
  # .deb 必须提供 maintainer，否则 fpm 直接报错退出
  maintainer: suimi8 <suimi8@users.noreply.github.com>
  synopsis: OpenCode 免费层网关
  description: 把 OpenCode 免费层整理成本地 OpenAI / Responses 兼容网关
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  desktop:
    entry:
      Name: OpenCode 免费层网关
      Comment: OpenCode 免费层网关
      Categories: Network;Development;

# ── macOS ──
mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # 没有 Apple 开发者证书：不签名、不公证。
  # 用户首次打开需右键 → 打开（或在系统设置里允许）。
  identity: null
  notarize: false
  gatekeeperAssess: false

# 不做自动更新
publish: null
