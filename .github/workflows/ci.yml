name: CI

on:
  push:
    branches: [main, master]
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 环境信息
        run: node -e "console.log('node', process.version, '|', process.platform, process.arch)"

      - name: 检查 node:sqlite 可用（需要 Node >= 22.5）
        run: |
          node -e "const {DatabaseSync}=require('node:sqlite'); const d=new DatabaseSync(':memory:'); d.exec('CREATE TABLE t(a)'); d.prepare('INSERT INTO t VALUES(?)').run(1); console.log('node:sqlite OK', d.prepare('SELECT a FROM t').get());"

      - name: 语法检查 + 凭据泄漏扫描
        run: node scripts/check-syntax.mjs

      - name: 单元测试（协议互转，纯逻辑）
        run: node tests/unit.mjs

      - name: 冒烟测试（面板 HTTP 层，不连上游）
        run: node tests/smoke.mjs

      - name: Shell 脚本语法与换行符
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          bad=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "语法错误: $f"; bad=1; }
            if grep -q $'\r' "$f"; then echo "含 CRLF（应为 LF）: $f"; bad=1; fi
          done < <(find . -name '*.sh' -not -path './node_modules/*')
          exit $bad

      - name: PowerShell 脚本语法
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 -ErrorAction SilentlyContinue | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count) {
              $bad++
              Write-Host "FAIL $($_.FullName)"
              $errors | Select-Object -First 3 | ForEach-Object { Write-Host "     $_" }
            }
          }
          if ($bad) { exit 1 } else { Write-Host "PowerShell 脚本语法全部通过" }

      # 全新数据库必须是**空的**：不内置渠道、模型、订阅、镜像。
      # 这些值一旦由程序塞进去，用户就分不清哪些是自己配的、哪些是程序配的。
      #
      # ⚠️ 写法注意：GitHub Actions 用 `bash -e -o pipefail` 执行，
      #    `grep -o ... | wc -l` 在**没匹配到**时 grep 返回 1，
      #    pipefail 会让整条管道失败，再被 -e 直接中止脚本（实测踩过）。
      #    所以所有「统计类」管道后面都跟 `|| true`，只取输出不取状态。
      - name: 全新安装不内置任何东西
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          WORK="$(mktemp -d)"
          export WORK
          PANEL_DB="$WORK/panel.db" PANEL_PORT=18901 PANEL_NODE_POOL=0 \
            MIHOMO_RUNTIME="$WORK/mihomo" \
            node 01-管理面板/server.mjs & SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          for i in $(seq 1 80); do sleep 0.25; curl -fsS --max-time 2 http://127.0.0.1:18901/ -o /dev/null && break; done

          CK="$WORK/ck.txt"
          curl -fsS -X POST http://127.0.0.1:18901/api/login -H 'content-type: application/json' \
            -d '{"password":"admin123"}' -c "$CK" | grep -q '"ok":true'
          echo "✅ 登录成功"

          # 1) 渠道必须 0 个（不再种默认渠道）
          N=$(curl -fsS http://127.0.0.1:18901/api/channels -b "$CK" | grep -o '"id":[0-9]*' | wc -l || true)
          N=$(echo "$N" | tr -d '[:space:]')
          if [ "$N" != "0" ]; then echo "❌ 全新安装竟然有 $N 个内置渠道"; exit 1; fi
          echo "✅ 全新安装渠道数 = 0"

          # 2) 拿个令牌（后续查 /v1/models 用）
          TK=$(curl -fsS -X POST http://127.0.0.1:18901/api/tokens -b "$CK" \
            -H 'content-type: application/json' -d '{"name":"ci","unlimited":true}' || true)
          KEY=$(echo "$TK" | sed -n 's/.*"key" *: *"\([^"]*\)".*/\1/p')
          if [ -z "$KEY" ]; then echo "❌ 没拿到令牌，响应: $TK"; exit 1; fi
          echo "✅ 已创建令牌"

          # 3) 没配渠道 → /v1/models 必须为空
          M=$(curl -fsS http://127.0.0.1:18901/v1/models -H "Authorization: Bearer $KEY" | grep -o '"id"' | wc -l || true)
          M=$(echo "$M" | tr -d '[:space:]')
          if [ "$M" != "0" ]; then echo "❌ 没配渠道却返回了 $M 个模型"; exit 1; fi
          echo "✅ 全新安装模型数 = 0"

          # 4) 代理订阅也必须为空
          P=$(curl -fsS http://127.0.0.1:18901/api/proxy-pool/providers -b "$CK" | grep -o '"name"' | wc -l || true)
          P=$(echo "$P" | tr -d '[:space:]')
          if [ "$P" != "0" ]; then echo "❌ 竟然内置了 $P 个订阅"; exit 1; fi
          echo "✅ 全新安装订阅数 = 0"

          # 5) 内核未安装（临时 runtime 是空目录）
          CORE=$(curl -fsS http://127.0.0.1:18901/api/proxy-pool/core -b "$CK" || true)
          echo "$CORE" | grep -q '"installed":false' || { echo "❌ 临时目录里竟然有内核: $CORE"; exit 1; }
          echo "✅ 全新安装未装内核"

          # 6) 用户自己建渠道后，/v1/models 正好等于他填的两个
          CH=$(curl -fsS -X POST http://127.0.0.1:18901/api/channels -b "$CK" \
            -H 'content-type: application/json' \
            -d '{"name":"ci-chan","type":"openai","base_url":"https://example.com/v1/chat/completions","api_key":"x","models":["ci-model-1","ci-model-2"],"priority":1,"status":1}' || true)
          echo "$CH" | grep -q 'ci-model-1' || { echo "❌ 自建渠道失败: $CH"; exit 1; }
          M2=$(curl -fsS http://127.0.0.1:18901/v1/models -H "Authorization: Bearer $KEY" | grep -o '"id"' | wc -l || true)
          M2=$(echo "$M2" | tr -d '[:space:]')
          if [ "$M2" != "2" ]; then echo "❌ /v1/models 期望 2 个，实际 $M2"; exit 1; fi
          echo "✅ 自建渠道后 /v1/models = $M2 个（正好是用户填的）"

          echo "全部通过：全新安装没有任何内置值"

  docker:
    name: Docker 构建与运行
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: 09-服务端部署/Dockerfile
          load: true
          tags: opencode-free-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 镜像体积
        run: docker images opencode-free-gateway:ci --format '  {{.Repository}}:{{.Tag}}  {{.Size}}'

      - name: 启动容器
        run: |
          docker run -d --name ocgw-ci -p 127.0.0.1:8790:8790 \
            -e PANEL_PASSWORD=ci-pass \
            -e PANEL_NODE_POOL=0 \
            -v ocgw-ci-data:/app/data \
            opencode-free-gateway:ci

      - name: 等健康检查转 healthy
        run: |
          set -e
          for i in $(seq 1 40); do
            s=$(docker inspect -f '{{.State.Health.Status}}' ocgw-ci 2>/dev/null || echo none)
            echo "  健康状态: $s"
            [ "$s" = healthy ] && break
            [ "$s" = unhealthy ] && { docker logs ocgw-ci; exit 1; }
            sleep 3
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' ocgw-ci)" = healthy ]

      - name: 容器内功能验证
        run: |
          set -e
          curl -fsS http://127.0.0.1:8790/ -o /dev/null && echo "GET / ✅"
          curl -fsS -X POST http://127.0.0.1:8790/api/login \
            -H 'content-type: application/json' -d '{"password":"ci-pass"}' -c /tmp/ck | grep -q '"ok":true'
          echo "登录（PANEL_PASSWORD 生效）✅"
          curl -fsS http://127.0.0.1:8790/api/channels -b /tmp/ck | grep -q 'OpenCode' && echo "默认渠道已种子 ✅"

          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8790/api/tokens -b /tmp/ck \
            -H 'content-type: application/json' -d '{"name":"ci","unlimited":true}' \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).key))")
          echo "令牌: ${TOKEN:0:10}…"

          N=$(curl -fsS http://127.0.0.1:8790/v1/models -H "Authorization: Bearer $TOKEN" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).data.length))")
          echo "GET /v1/models -> $N 个模型"
          [ "$N" -ge 1 ]

          curl -fsS http://127.0.0.1:8790/api/protocols -b /tmp/ck -o /dev/null && echo "GET /api/protocols ✅"
          curl -fsS http://127.0.0.1:8790/api/proxy-pool -b /tmp/ck | grep -q '"enabled":false' && echo "节点池默认关闭 ✅"

      - name: 数据持久化验证（重启容器）
        run: |
          set -e
          docker restart ocgw-ci >/dev/null
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8790/ -o /dev/null 2>/dev/null && break; sleep 2; done
          curl -fsS -X POST http://127.0.0.1:8790/api/login \
            -H 'content-type: application/json' -d '{"password":"ci-pass"}' -c /tmp/ck2 >/dev/null
          curl -fsS http://127.0.0.1:8790/api/tokens -b /tmp/ck2 | grep -q 'sk-' && echo "重启后令牌仍在，数据持久化 ✅"

      - name: 容器里不应存在凭据与内核
        run: |
          set -e
          docker exec ocgw-ci sh -c 'test -f "/app/10-代理节点管理/subscriptions.json"' \
            && { echo "❌ 镜像里竟有 subscriptions.json"; exit 1; } || echo "无 subscriptions.json ✅"
          docker exec ocgw-ci sh -c 'ls /app/10-代理节点管理/runtime/mihomo* 2>/dev/null' \
            && { echo "❌ 镜像里竟有 mihomo 内核"; exit 1; } || echo "无 mihomo 内核 ✅"
          [ "$(docker exec ocgw-ci id -u)" = "1000" ] && echo "以非 root 运行 ✅"

      - name: compose 配置校验（默认 + pool profile）
        run: |
          set -e
          cd 09-服务端部署
          docker compose config --quiet && echo "compose 默认配置合法 ✅"
          PANEL_NODE_POOL=1 docker compose --profile pool config --quiet && echo "compose pool profile 合法 ✅"

      - name: 失败时导出容器日志
        if: failure()
        run: docker logs ocgw-ci || true

      - name: 清理
        if: always()
        run: docker rm -f ocgw-ci || true

  package:
    name: 打包
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 构建发布包
        run: node scripts/package.mjs

      - name: 列出产物
        run: ls -lh dist/

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-free-gateway-${{ github.sha }}
          path: dist/*
          retention-days: 30
