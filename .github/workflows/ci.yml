name: CI

on:
  push:
    branches: [main, master]
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 环境信息
        run: node -e "console.log('node', process.version, '|', process.platform, process.arch)"

      - name: 检查 node:sqlite 可用（需要 Node >= 22.5）
        run: |
          node -e "const {DatabaseSync}=require('node:sqlite'); const d=new DatabaseSync(':memory:'); d.exec('CREATE TABLE t(a)'); d.prepare('INSERT INTO t VALUES(?)').run(1); console.log('node:sqlite OK', d.prepare('SELECT a FROM t').get());"

      - name: 语法检查 + 凭据泄漏扫描
        run: node scripts/check-syntax.mjs

      - name: 单元测试（协议互转，纯逻辑）
        run: node tests/unit.mjs

      - name: 冒烟测试（面板 HTTP 层，不连上游）
        run: node tests/smoke.mjs

      - name: Shell 脚本语法与换行符
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          bad=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "语法错误: $f"; bad=1; }
            if grep -q $'\r' "$f"; then echo "含 CRLF（应为 LF）: $f"; bad=1; fi
          done < <(find . -name '*.sh' -not -path './node_modules/*')
          exit $bad

      - name: PowerShell 脚本语法
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 -ErrorAction SilentlyContinue | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count) {
              $bad++
              Write-Host "FAIL $($_.FullName)"
              $errors | Select-Object -First 3 | ForEach-Object { Write-Host "     $_" }
            }
          }
          if ($bad) { exit 1 } else { Write-Host "PowerShell 脚本语法全部通过" }

      - name: 面板默认渠道种子可自查（全新数据库）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          TMPDB="$(mktemp -d)/panel.db"
          PANEL_DB="$TMPDB" PANEL_PORT=18901 PANEL_NODE_POOL=0 PANEL_MODEL_DISCOVERY=0 \
            node 01-管理面板/server.mjs & SRV=$!
          for i in $(seq 1 60); do sleep 0.25; curl -fsS --max-time 2 http://127.0.0.1:18901/ -o /dev/null && break; done
          curl -fsS -X POST http://127.0.0.1:18901/api/login -H 'content-type: application/json' \
            -d '{"password":"admin123"}' -c /tmp/ck.txt | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:18901/api/channels -b /tmp/ck.txt | grep -q 'OpenCode'
          echo "默认种子渠道 OK"
          kill $SRV 2>/dev/null || true

  docker:
    name: Docker 构建与运行
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: 09-服务端部署/Dockerfile
          load: true
          tags: opencode-free-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 镜像体积
        run: docker images opencode-free-gateway:ci --format '  {{.Repository}}:{{.Tag}}  {{.Size}}'

      - name: 启动容器
        run: |
          docker run -d --name ocgw-ci -p 127.0.0.1:8790:8790 \
            -e PANEL_PASSWORD=ci-pass \
            -e PANEL_NODE_POOL=0 \
            -v ocgw-ci-data:/app/data \
            opencode-free-gateway:ci

      - name: 等健康检查转 healthy
        run: |
          set -e
          for i in $(seq 1 40); do
            s=$(docker inspect -f '{{.State.Health.Status}}' ocgw-ci 2>/dev/null || echo none)
            echo "  健康状态: $s"
            [ "$s" = healthy ] && break
            [ "$s" = unhealthy ] && { docker logs ocgw-ci; exit 1; }
            sleep 3
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' ocgw-ci)" = healthy ]

      - name: 容器内功能验证
        run: |
          set -e
          curl -fsS http://127.0.0.1:8790/ -o /dev/null && echo "GET / ✅"
          curl -fsS -X POST http://127.0.0.1:8790/api/login \
            -H 'content-type: application/json' -d '{"password":"ci-pass"}' -c /tmp/ck | grep -q '"ok":true'
          echo "登录（PANEL_PASSWORD 生效）✅"
          curl -fsS http://127.0.0.1:8790/api/channels -b /tmp/ck | grep -q 'OpenCode' && echo "默认渠道已种子 ✅"

          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8790/api/tokens -b /tmp/ck \
            -H 'content-type: application/json' -d '{"name":"ci","unlimited":true}' \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).key))")
          echo "令牌: ${TOKEN:0:10}…"

          N=$(curl -fsS http://127.0.0.1:8790/v1/models -H "Authorization: Bearer $TOKEN" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).data.length))")
          echo "GET /v1/models -> $N 个模型"
          [ "$N" -ge 1 ]

          curl -fsS http://127.0.0.1:8790/api/protocols -b /tmp/ck -o /dev/null && echo "GET /api/protocols ✅"
          curl -fsS http://127.0.0.1:8790/api/proxy-pool -b /tmp/ck | grep -q '"enabled":false' && echo "节点池默认关闭 ✅"

      - name: 数据持久化验证（重启容器）
        run: |
          set -e
          docker restart ocgw-ci >/dev/null
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8790/ -o /dev/null 2>/dev/null && break; sleep 2; done
          curl -fsS -X POST http://127.0.0.1:8790/api/login \
            -H 'content-type: application/json' -d '{"password":"ci-pass"}' -c /tmp/ck2 >/dev/null
          curl -fsS http://127.0.0.1:8790/api/tokens -b /tmp/ck2 | grep -q 'sk-' && echo "重启后令牌仍在，数据持久化 ✅"

      - name: 容器里不应存在凭据与内核
        run: |
          set -e
          docker exec ocgw-ci sh -c 'test -f "/app/10-代理节点管理/subscriptions.json"' \
            && { echo "❌ 镜像里竟有 subscriptions.json"; exit 1; } || echo "无 subscriptions.json ✅"
          docker exec ocgw-ci sh -c 'ls /app/10-代理节点管理/runtime/mihomo* 2>/dev/null' \
            && { echo "❌ 镜像里竟有 mihomo 内核"; exit 1; } || echo "无 mihomo 内核 ✅"
          [ "$(docker exec ocgw-ci id -u)" = "1000" ] && echo "以非 root 运行 ✅"

      - name: compose 配置校验（默认 + pool profile）
        run: |
          set -e
          cd 09-服务端部署
          docker compose config --quiet && echo "compose 默认配置合法 ✅"
          PANEL_NODE_POOL=1 docker compose --profile pool config --quiet && echo "compose pool profile 合法 ✅"

      - name: 失败时导出容器日志
        if: failure()
        run: docker logs ocgw-ci || true

      - name: 清理
        if: always()
        run: docker rm -f ocgw-ci || true

  package:
    name: 打包
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 构建发布包
        run: node scripts/package.mjs

      - name: 列出产物
        run: ls -lh dist/

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-free-gateway-${{ github.sha }}
          path: dist/*
          retention-days: 30
