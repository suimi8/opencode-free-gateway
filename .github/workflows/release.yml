name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v1.0.0），仅手动触发时使用'
        required: false

permissions:
  contents: write

jobs:
  verify:
    name: 发布前验证 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-syntax.mjs
      - run: node tests/unit.mjs
      - run: node tests/smoke.mjs

  release:
    name: 打包并发布
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 确定版本号
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ github.event.inputs.version || '0.0.0-dev' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: 把 package.json 版本对齐 tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          node -e "
            const fs=require('fs');
            const p=JSON.parse(fs.readFileSync('package.json','utf8'));
            p.version='$VER';
            fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');
            console.log('package.json version ->', p.version);
          "

      - name: 构建发布包
        run: node scripts/package.mjs

      - name: 生成校验信息
        shell: bash
        run: |
          echo "## 产物" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh dist/ | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat dist/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
          body: |
            ## 安装

            ```bash
            tar -xzf opencode-free-gateway-*.tar.gz
            cd opencode-free-gateway-*
            node --version          # 需要 >= 22.5（用到 node:sqlite）
            node 01-管理面板/server.mjs
            ```

            打开 <http://127.0.0.1:8790/> ，初始密码 `admin123`（**请立刻修改**）。

            ## 说明

            - 零第三方依赖，只用 Node 内置模块。
            - **不包含**任何凭据、订阅链接、第三方源码或内核二进制。
            - 代理节点池需要 mihomo 内核，用 `node 10-代理节点管理/install-core.mjs` 运行时下载
              （mihomo 为 GPL-3.0，与本项目 MIT 许可相互独立）。
          token: ${{ secrets.GITHUB_TOKEN }}
