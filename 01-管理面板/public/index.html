<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenCode 免费层网关</title>
<style>
:root{
  --bg:#0d1117; --bg2:#161b22; --bg3:#1c2230; --line:#2a3140; --fg:#e6edf3; --dim:#8b949e;
  --acc:#3b82f6; --acc2:#1f6feb; --ok:#3fb950; --warn:#d29922; --bad:#f85149; --pur:#a371f7;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
.hidden{display:none!important}
a{color:var(--acc);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--bg3);padding:7px 13px;border-radius:8px;transition:.15s}
button:hover{border-color:var(--acc);background:#22304a}
button.primary{background:var(--acc2);border-color:var(--acc2);color:#fff}
button.primary:hover{background:#2d7ff0}
button.danger{color:var(--bad);border-color:#5a2a2a}
button.danger:hover{background:#3a1d1d;border-color:var(--bad)}
button.sm{padding:4px 9px;font-size:12px;border-radius:6px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 11px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
label{display:block;font-size:12px;color:var(--dim);margin:12px 0 5px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}

/* 登录 */
.login-wrap{height:100%;display:grid;place-items:center}
.login{width:340px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:28px}
.login h1{margin:0 0 4px;font-size:19px}
.login p{margin:0 0 18px;color:var(--dim);font-size:12px}

/* 布局 */
.app{display:grid;grid-template-columns:212px 1fr;height:100%}
aside{background:var(--bg2);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px}
.brand{font-weight:600;padding:6px 10px 16px;font-size:15px;display:flex;align-items:center;gap:8px}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
nav a{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;color:var(--dim);cursor:pointer}
nav a:hover{background:var(--bg3);color:var(--fg)}
nav a.on{background:var(--bg3);color:var(--fg);box-shadow:inset 2px 0 0 var(--acc)}
nav a span{font-size:15px;width:18px;text-align:center}
.side-foot{margin-top:auto;font-size:11px;color:var(--dim);padding:10px}
main{overflow:auto;padding:22px 26px 60px}
h2{margin:0 0 4px;font-size:19px}
.sub{color:var(--dim);font-size:12px;margin-bottom:18px}

/* 卡片 */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.card .k{font-size:11px;color:var(--dim);letter-spacing:.04em}
.card .v{font-size:23px;font-weight:600;margin-top:5px}
.card .v small{font-size:12px;color:var(--dim);font-weight:400}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.panel>h3{margin:0;padding:12px 16px;font-size:13px;border-bottom:1px solid var(--line);color:var(--dim);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.panel .body{padding:14px 16px}

/* 表格 */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--dim);font-weight:500;font-size:11.5px;letter-spacing:.03em;background:#12171f}
tbody tr:hover{background:#161d29}
td.wrap{white-space:normal;max-width:420px;word-break:break-all}
.tbl-wrap{overflow:auto;max-height:640px}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}

/* 徽章 */
.b{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;border:1px solid}
.b.ok{color:var(--ok);border-color:#1f4429;background:#0f2417}
.b.bad{color:var(--bad);border-color:#5a2a2a;background:#2a1414}
.b.warn{color:var(--warn);border-color:#4d3b12;background:#241d0c}
.b.dim{color:var(--dim);border-color:var(--line);background:var(--bg3)}
.b.acc{color:var(--acc);border-color:#1b3a63;background:#0f1d31}

/* 图表 */
.chart{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:8px}
.chart .bar{flex:1;min-width:14px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;position:relative}
.chart .bar i{width:100%;background:linear-gradient(180deg,var(--acc),#1b4b8f);border-radius:4px 4px 0 0;min-height:2px;transition:.2s}
.chart .bar:hover i{background:linear-gradient(180deg,#60a5fa,#2563eb)}
.chart .bar em{font-size:10px;color:var(--dim);font-style:normal}
.chart .bar b{position:absolute;top:-16px;font-size:10px;color:var(--dim);font-weight:400}

/* 模态 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:grid;place-items:center;z-index:50;padding:20px}
.modal .box{background:var(--bg2);border:1px solid var(--line);border-radius:14px;width:min(560px,100%);max-height:88vh;overflow:auto;padding:22px}
.modal h3{margin:0 0 6px;font-size:16px}
.modal .foot{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px;overflow:auto;font-size:12px;margin:8px 0 0;max-height:260px;white-space:pre-wrap;word-break:break-all}

/* toast */
#toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:9px;z-index:99}
.toast{background:var(--bg3);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:8px;padding:11px 15px;font-size:13px;animation:in .2s;max-width:380px;box-shadow:0 8px 26px rgba(0,0,0,.45)}
.toast.ok{border-left-color:var(--ok)} .toast.bad{border-left-color:var(--bad)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.empty{color:var(--dim);text-align:center;padding:34px;font-size:13px}
.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar input,.toolbar select{width:auto;min-width:130px}
</style>
</head>
<body>

<div id="login" class="login-wrap hidden">
  <div class="login">
    <h1>OpenCode 免费层网关</h1>
    <p id="loginSub">请输入管理密码</p>
    <label>密码</label>
    <input id="pw" type="password" placeholder="admin123" autocomplete="current-password">
    <div style="height:18px"></div>
    <button class="primary" style="width:100%" onclick="doLogin()">登录</button>
  </div>
</div>

<div id="app" class="app hidden">
  <aside>
    <div class="brand"><i></i><span id="brandName">免费层网关</span></div>
    <nav id="nav">
      <a data-r="dashboard"><span>◈</span>仪表盘</a>
      <a data-r="channels"><span>☰</span>渠道管理</a>
      <a data-r="tokens"><span>⚿</span>令牌管理</a>
      <a data-r="models"><span>✦</span>模型列表</a>
      <a data-r="proxy"><span>⇄</span>代理订阅</a>
      <a data-r="logs"><span>≡</span>请求日志</a>
      <a data-r="settings"><span>⚙</span>系统设置</a>
    </nav>
    <div class="side-foot">
      <div id="ver">v1.0</div>
      <div style="margin-top:6px"><a onclick="doLogout()" style="cursor:pointer">退出登录</a></div>
    </div>
  </aside>
  <main id="main"></main>
</div>

<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"></div>
<div id="toast"></div>

<script>
/* ══════════════════════════════════════════════ 基础 */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtN = (n) => (n ?? 0).toLocaleString('en-US');
const fmtT = (t) => t ? new Date(t).toLocaleString('zh-CN', { hour12: false }) : '-';
const ago = (t) => { if (!t) return '-'; const d = Date.now() - t; if (d < 6e4) return Math.round(d / 1000) + 's 前'; if (d < 36e5) return Math.round(d / 6e4) + 'm 前'; if (d < 864e5) return Math.round(d / 36e5) + 'h 前'; return Math.round(d / 864e5) + 'd 前'; };
const dur = (ms) => ms == null ? '-' : ms < 1000 ? ms + 'ms' : (ms / 1000).toFixed(2) + 's';

function toast(msg, kind = '') {
  const d = document.createElement('div');
  d.className = 'toast ' + kind;
  d.textContent = msg;
  $('#toast').appendChild(d);
  setTimeout(() => d.remove(), 4200);
}

async function api(path, opts = {}) {
  const r = await fetch(path, {
    credentials: 'same-origin',
    headers: { 'content-type': 'application/json' },
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (r.status === 401 && !path.includes('login')) { showLogin(); throw new Error('未登录'); }
  const t = await r.text();
  let j = null; try { j = JSON.parse(t); } catch {}
  if (!r.ok) throw new Error(j?.error?.message || j?.error || t.slice(0, 200) || ('HTTP ' + r.status));
  return j;
}

/* ══════════════════════════════════════════════ 登录 */
async function boot() {
  try {
    const me = await api('/api/me');
    if (me.site_name) $('#brandName').textContent = me.site_name;
    if (me.admin) { showApp(); return; }
  } catch {}
  showLogin();
}
function showLogin() { $('#login').classList.remove('hidden'); $('#app').classList.add('hidden'); }
function showApp() { $('#login').classList.add('hidden'); $('#app').classList.remove('hidden'); route(); }
async function doLogin() {
  const pw = $('#pw').value;
  try { await api('/api/login', { method: 'POST', body: { password: pw } }); showApp(); }
  catch (e) { toast(e.message, 'bad'); }
}
async function doLogout() { await api('/api/logout', { method: 'POST' }).catch(() => {}); showLogin(); }
$('#pw')?.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });

/* ══════════════════════════════════════════════ 路由 */
let ROUTE = 'dashboard';
document.addEventListener('click', (e) => {
  const a = e.target.closest('nav a'); if (!a) return;
  ROUTE = a.dataset.r;
  document.querySelectorAll('nav a').forEach((x) => x.classList.toggle('on', x === a));
  route();
});
function route() {
  document.querySelectorAll('nav a').forEach((x) => x.classList.toggle('on', x.dataset.r === ROUTE));
  ({ dashboard: viewDashboard, channels: viewChannels, tokens: viewTokens, models: viewModels, proxy: viewProxy, logs: viewLogs, settings: viewSettings }[ROUTE] || viewDashboard)();
}
const M = (html) => { $('#main').innerHTML = html; };

/* ══════════════════════════════════════════════ 仪表盘 */
async function viewDashboard() {
  M('<h2>仪表盘</h2><div class="sub">加载中…</div>');
  const s = await api('/api/stats?range=all').catch((e) => { M('<div class="empty">' + esc(e.message) + '</div>'); return null; });
  if (!s) return;
  const rate = s.total ? (s.ok / s.total * 100).toFixed(1) : '0.0';
  const maxDay = Math.max(1, ...s.byDay.map((d) => d.n));
  M(`
  <h2>仪表盘</h2>
  <div class="sub">累计请求与上游用量总览</div>
  <div class="cards">
    <div class="card"><div class="k">总请求</div><div class="v">${fmtN(s.total)}</div></div>
    <div class="card"><div class="k">成功率</div><div class="v" style="color:${rate >= 95 ? 'var(--ok)' : rate >= 80 ? 'var(--warn)' : 'var(--bad)'}">${rate}<small>%</small></div></div>
    <div class="card"><div class="k">总 TOKEN</div><div class="v">${fmtN(s.tokens)}</div></div>
    <div class="card"><div class="k">平均延迟</div><div class="v">${s.avgMs}<small>ms</small></div></div>
    <div class="card"><div class="k">渠道 / 令牌</div><div class="v">${s.channels}<small> / ${s.tokens}</small></div></div>
  </div>

  <div class="panel"><h3>近 14 天请求量</h3><div class="body">
    ${s.byDay.length ? `<div class="chart">${[...s.byDay].reverse().map((d) => `
      <div class="bar" title="${d.d} · ${d.n} 次 · ${d.ok} 成功 · ${fmtN(d.tk)} tokens">
        <b>${d.n}</b><i style="height:${Math.max(2, d.n / maxDay * 100)}%"></i><em>${d.d.slice(5)}</em>
      </div>`).join('')}</div>` : '<div class="empty">暂无数据</div>'}
  </div></div>

  <div class="panel"><h3>按模型</h3><div class="tbl-wrap"><table>
    <thead><tr><th>模型</th><th>请求</th><th>成功</th><th>成功率</th><th>TOKEN</th><th>平均延迟</th></tr></thead>
    <tbody>${s.byModel.length ? s.byModel.map((m) => `<tr>
      <td class="mono">${esc(m.model || '-')}</td><td>${fmtN(m.n)}</td><td>${fmtN(m.ok)}</td>
      <td>${m.n ? (m.ok / m.n * 100).toFixed(1) : 0}%</td><td>${fmtN(m.tk)}</td><td>${Math.round(m.avg_ms || 0)}ms</td>
    </tr>`).join('') : '<tr><td colspan="6" class="empty">暂无数据</td></tr>'}</tbody>
  </table></div></div>

  <div class="panel"><h3>按渠道</h3><div class="tbl-wrap"><table>
    <thead><tr><th>渠道</th><th>请求</th><th>成功</th><th>平均延迟</th></tr></thead>
    <tbody>${s.byChannel.length ? s.byChannel.map((c) => `<tr>
      <td>${esc(c.channel_name || '-')}</td><td>${fmtN(c.n)}</td><td>${fmtN(c.ok)}</td><td>${Math.round(c.avg_ms || 0)}ms</td>
    </tr>`).join('') : '<tr><td colspan="4" class="empty">暂无数据</td></tr>'}</tbody>
  </table></div></div>

  ${s.cooldowns?.length ? `<div class="panel"><h3>模型冷却中 <button class="sm" onclick="clearCd()">全部解除</button></h3><div class="body">
    ${s.cooldowns.map((c) => `<span class="b warn" style="margin:3px">${esc(c.key)} · ${Math.round(c.leftMs / 60000)}m</span>`).join('')}
  </div></div>` : ''}

  ${s.errors?.length ? `<div class="panel"><h3>失败分布</h3><div class="tbl-wrap"><table>
    <thead><tr><th>状态</th><th>错误</th><th>次数</th></tr></thead>
    <tbody>${s.errors.map((e) => `<tr><td><span class="b bad">${e.status || '网络'}</span></td><td class="wrap mono">${esc(e.error || '')}</td><td>${e.n}</td></tr>`).join('')}</tbody>
  </table></div></div>` : ''}
  `);
}
async function clearCd() { await api('/api/cooldowns', { method: 'DELETE' }); toast('已解除全部冷却', 'ok'); viewDashboard(); }

/* ══════════════════════════════════════════════ 渠道 */
async function viewChannels() {
  M('<h2>渠道管理</h2><div class="sub">加载中…</div>');
  const { rows } = await api('/api/channels');
  M(`
  <h2>渠道管理</h2>
  <div class="sub">opencode 类型使用免费层形状请求；openai 类型为通用 OpenAI 兼容上游</div>
  <div class="toolbar">
    <button class="primary" onclick="editChannel()">+ 添加渠道</button>
    <button onclick="viewChannels()">刷新</button>
  </div>
  <div class="panel"><div class="tbl-wrap"><table>
    <thead><tr><th>ID</th><th>名称</th><th>类型</th><th>模型</th><th>代理</th><th>优先级</th><th>状态</th><th>操作</th></tr></thead>
    <tbody>${rows.length ? rows.map((c) => `<tr>
      <td>${c.id}</td>
      <td><b>${esc(c.name)}</b><div style="font-size:11px;color:var(--dim)" class="mono">${esc(c.base_url || '')}</div></td>
      <td><span class="b ${c.type === 'opencode' ? 'acc' : 'dim'}">${esc(c.type)}</span></td>
      <td>${c.models.length} 个<div style="font-size:11px;color:var(--dim)" class="mono">${esc(c.models.slice(0, 2).join(', '))}${c.models.length > 2 ? ' …' : ''}</div></td>
      <td class="mono" style="font-size:11px">${esc(c.proxy || '直连')}</td>
      <td>${c.priority}</td>
      <td>${c.status ? (c.down ? `<span class="b warn" title="${esc(c.disabled_reason || '')}">冷却中</span>` : '<span class="b ok">启用</span>') : '<span class="b bad">禁用</span>'}</td>
      <td>
        <button class="sm" onclick="testChannel(${c.id})">测试</button>
        <button class="sm" onclick="editChannel(${c.id})">编辑</button>
        <button class="sm" onclick="toggleChannel(${c.id})">${c.status ? '禁用' : '启用'}</button>
        <button class="sm danger" onclick="delChannel(${c.id})">删除</button>
      </td>
    </tr>`).join('') : '<tr><td colspan="8" class="empty">还没有渠道，点「添加渠道」开始</td></tr>'}</tbody>
  </table></div></div>`);
}

/* ⚠️ 不再内置模型清单。
 * 以前这里有个 FREE_MODELS 常量并预填进「添加渠道」弹窗，
 * 导致用户根本没配过的模型名出现在自己的渠道里。
 * 现在输入框是空的，由用户自己粘贴；不想手打就点「从上游拉取」。
 */
async function editChannel(id) {
  let c = { name: '', type: 'opencode', base_url: '', api_key: '', models: [], proxy: '', priority: 0, extra: {} };
  if (id) c = await api('/api/channels/' + id);
  openModal(`
    <h3>${id ? '编辑' : '添加'}渠道</h3>
    <label>名称</label><input id="f_name" value="${esc(c.name)}" placeholder="比如：我的上游">
    <label>类型</label>
    <select id="f_type">
      <option value="opencode"${c.type === 'opencode' ? ' selected' : ''}>opencode（免费层形状请求）</option>
      <option value="openai"${c.type === 'openai' ? ' selected' : ''}>openai（通用 OpenAI 兼容）</option>
    </select>
    <label>上游地址（chat/completions 完整地址）</label>
    <input id="f_url" value="${esc(c.base_url || '')}" placeholder="https://你的上游/v1/chat/completions">
    <label>API Key</label><input id="f_key" value="${esc(c.api_key || '')}" placeholder="opencode 类型填 public；其它填你的 key">
    <label>模型列表（每行一个）</label>
    <textarea id="f_models" rows="7" class="mono" placeholder="model-name-1&#10;model-name-2">${esc((c.models || []).join('\n'))}</textarea>
    <div class="row" style="margin-top:8px">
      <button class="sm" onclick="pullModels()">⤓ 从上游拉取模型</button>
    </div>
    <label>代理（可逗号分隔多节点，留空直连）</label>
    <input id="f_proxy" class="mono" value="${esc(c.proxy || '')}" placeholder="http://127.0.0.1:7897,socks5://127.0.0.1:7897">
    <label>优先级（大的优先）</label><input id="f_pri" type="number" value="${c.priority ?? 0}">
    <label>自定义 User-Agent（留空用内置）</label><input id="f_ua" class="mono" value="${esc(c.extra?.ua || '')}">
    <div class="foot"><button onclick="closeModal()">取消</button><button class="primary" onclick="saveChannel(${id || 0})">保存</button></div>
  `);
}
/** 用当前填的上游地址去拉一次模型列表，填进输入框。不内置任何模型名。 */
async function pullModels() {
  const base_url = $('#f_url').value.trim();
  const api_key = $('#f_key').value.trim();
  const type = $('#f_type').value;
  if (!base_url) return toast('先填上游地址', 'bad');
  toast('正在从上游拉取模型列表…');
  try {
    const r = await api('/api/channels/probe-models', { method: 'POST', body: { base_url, api_key, type } });
    if (!r.models || !r.models.length) return toast('上游没返回模型（HTTP ' + (r.status || '?') + '）', 'bad');
    const cur = $('#f_models').value.trim();
    $('#f_models').value = cur ? cur + '\n' + r.models.join('\n') : r.models.join('\n');
    toast(`拉到 ${r.models.length} 个模型（HTTP ${r.status}${r.note ? ' · ' + r.note : ''}）`, 'ok');
  } catch (e) { toast('拉取失败：' + e.message, 'bad'); }
}
async function saveChannel(id) {
  const body = {
    name: $('#f_name').value.trim() || '未命名渠道',
    type: $('#f_type').value,
    base_url: $('#f_url').value.trim(),
    api_key: $('#f_key').value.trim(),
    models: $('#f_models').value.split(/\r?\n/).map((s) => s.trim()).filter(Boolean),
    proxy: $('#f_proxy').value.trim(),
    priority: Number($('#f_pri').value || 0),
    extra: { ua: $('#f_ua').value.trim() || undefined },
  };
  try {
    if (id) await api('/api/channels/' + id, { method: 'PUT', body });
    else await api('/api/channels', { method: 'POST', body });
    closeModal(); toast('已保存', 'ok'); viewChannels();
  } catch (e) { toast(e.message, 'bad'); }
}

async function saveToken(id) {

           oninput="POOL.nodeFilter=this.value;renderNodeTable()" style="max-width:280px;margin:0">
    <label style="display:flex;align-items:center;gap:6px;margin:0;font-size:12px">
      <input type="checkbox" id="nodeAll" ${POOL.showInvalid ? 'checked' : ''}
             onchange="POOL.showInvalid=this.checked;renderNodeTable()" style="width:auto;margin:0">显示被剔除 / 无效
    </label>
    <button onclick="editManualNode()">＋ 手动添加节点</button>
    <button onclick="poolTestAll()">全池测速</button>
    <button onclick="poolRotate()">立即轮换</button>
  </div>
  <div id="nodeBox"></div>`;

  const exclArea = POOL.excluded.length ? `
  <h3 style="margin:22px 0 8px">已剔除 <span class="sub" style="font-weight:400">${POOL.excluded.length} 个</span></h3>
  <div class="panel" style="padding:12px 16px">
    ${POOL.excluded.map((x, i) => `<span class="b dim" style="margin:3px 6px 3px 0;display:inline-block">${esc(x)}
      <a style="cursor:pointer;margin-left:6px;color:var(--acc)" onclick="unexcludeByIndex(${i})">恢复</a></span>`).join('')}
  </div>` : '';

  M(hdr + provTable + nodeArea + exclArea);
  renderNodeTable();
  loadCore();
}

function nodeStatus(r) {
  if (!r.valid) return `<span class="b bad" title="${esc(r.invalidReason || '')}">剔除</span>`;
  if (r.status === 'in_use') return '<span class="b ok">租用中</span>';
  if (r.status === 'dead') return `<span class="b warn" title="${esc(r.last_error || '')}">失效</span>`;
  return '<span class="b dim">可用</span>';
}

function renderNodeTable() {
  const box = $('#nodeBox');
  if (!box) return;
  const q = (POOL.nodeFilter || '').trim().toLowerCase();
  let rows = POOL.nodes;
  if (q) rows = rows.filter((r) => [r.name, r.provider, r.server, r.type].some((v) => String(v || '').toLowerCase().includes(q)));
  if (!POOL.showInvalid) rows = rows.filter((r) => r.valid);
  const rank = (r) => (r.status === 'in_use' ? 0 : r.valid ? 1 : r.status === 'dead' ? 2 : 3);
  rows = rows.slice().sort((x, y) => rank(x) - rank(y) || (x.delay_ms ?? 99999) - (y.delay_ms ?? 99999));

  const MAX = 300;
  const shown = rows.slice(0, MAX);
  box.innerHTML = `<div class="panel"><div class="tbl-wrap"><table>
    <thead><tr><th>名称</th><th>来源</th><th>类型</th><th>地址</th><th>延迟</th><th>状态</th><th style="width:150px">操作</th></tr></thead>
    <tbody>${shown.length ? shown.map((r) => {
      const i = POOL.nodes.indexOf(r);
      return `<tr>
        <td><b>${esc(r.name)}</b>${r.manual ? ' <span class="b acc">手加</span>' : ''}</td>
        <td class="sub">${esc(r.provider || '-')}</td>
        <td><span class="b dim">${esc(r.type || '?')}</span></td>
        <td class="mono" style="font-size:11px">${esc((r.server || '-') + ':' + (r.port || '-'))}</td>
        <td>${r.delay_ms != null ? r.delay_ms + 'ms' : '-'}</td>
        <td>${nodeStatus(r)}</td>
        <td>
          ${r.valid
            ? `<button class="sm danger" onclick="excludeByIndex(${i})">剔除</button>`
            : `<button class="sm" onclick="unexcludeNode('${esc(r.name)}')">恢复</button>`}
          ${r.manual ? `<button class="sm danger" onclick="delManualNodeByIndex(${i})">删除</button>` : ''}
        </td>
      </tr>`;
    }).join('') : '<tr><td colspan="7" class="empty">没有匹配的节点</td></tr>'}</tbody>
  </table></div>
  ${rows.length > MAX ? `<div class="sub" style="padding:8px 14px">只显示前 ${MAX} 个，共 ${rows.length} 个 —— 用搜索缩小范围</div>` : ''}
  </div>`;
}

/* ── 订阅增删改 ── */
function editProvider(name) {
  let p = { name: '', url: '', enabled: true };
  if (name) {
    const found = ((POOL.prov || {}).rows || []).find((x) => x.name === name);
    if (found) p = found;
  }
  openModal(`
    <h3>${name ? '编辑' : '添加'}订阅</h3>
    <label>订阅名（仅字母 / 数字 / 下划线 / 短横线）</label>
    <input id="p_name" value="${esc(p.name)}" placeholder="airport-a" ${name ? 'readonly' : ''}>
    <label>Clash 订阅链接</label>
    <input id="p_url" value="" placeholder="https://example.com/api/v1/client/subscribe?token=xxxx">
    ${name ? '<div class="sub" style="margin-top:6px">出于安全，链接不显示；**留空表示不修改**</div>' : ''}
    <label style="display:flex;align-items:center;gap:8px;margin-top:14px">
      <input type="checkbox" id="p_en" ${p.enabled === false ? '' : 'checked'} style="width:auto;margin:0"> 启用这个订阅
    </label>
    <div class="sub" style="margin-top:10px;font-size:12px">支持 Clash / Clash Meta 订阅地址（机场面板里的「Clash」或「Clash Meta」那一项）。</div>
    <div class="toolbar" style="margin-top:16px">
      <button class="primary" onclick="saveProvider(${name ? JSON.stringify(name).replace(/"/g, '&quot;') : 'null'})">保存</button>
      <button onclick="closeModal()">取消</button>
    </div>`);
}

async function saveProvider(name) {
  const n = $('#p_name').value.trim();
  const url = $('#p_url').value.trim();
  const enabled = $('#p_en').checked;
  if (!n) return toast('订阅名不能为空', 'bad');
  try {
    const body = { name: n, enabled };
    if (url) body.url = url;
    else if (name) {
      // 后端会保留原链接：不传 url 即可
      toast('链接留空 → 保持原链接', '');
    } else {
      return toast('订阅链接不能为空', 'bad');
    }
    await api('/api/proxy-pool/providers', { method: 'POST', body });
    closeModal(); toast('已保存，点「应用改动」生效', 'ok'); viewProxy();
  } catch (e) { toast(e.message, 'bad'); }
}

async function delProvider(name) {
  if (!confirm('删除订阅「' + name + '」？节点会一起消失，点「应用改动」后生效。')) return;
  try { await api('/api/proxy-pool/providers?name=' + encodeURIComponent(name), { method: 'DELETE' }); toast('已删除', 'ok'); viewProxy(); }
  catch (e) { toast(e.message, 'bad'); }
}
async function toggleProvider(name, on) {
  try {
    await api('/api/proxy-pool/providers/toggle?name=' + encodeURIComponent(name) + '&on=' + (on ? 1 : 0), { method: 'POST' });
    toast(on ? '已启用' : '已停用', 'ok'); viewProxy();
  } catch (e) { toast(e.message, 'bad'); }
}
async function testProvider(name) {
  toast('正在拉取订阅…');
  try {
    const r = await api('/api/proxy-pool/providers/test?name=' + encodeURIComponent(name), { method: 'POST' });
    if (!r.ok) return toast('拉取失败：' + (r.error || ('HTTP ' + r.status)), 'bad');

  } catch (e) { toast(e.message, 'bad'); }
}

async function applyPoolConfig() {

async function refreshPoolSubs() {

async function poolTestAll() {

async function saveManualNode() {
  const name = $('#m_name').value.trim();

  try {
    await api('/api/proxy-pool/nodes/manual', { method: 'POST', body: { name, type, server, port, ...extra } });
    closeModal(); toast('已添加，点「应用改动」生效', 'ok'); viewProxy();
  } catch (e) { toast(e.message, 'bad'); }
}
async function delManualNodeByIndex(i) {

  if (!r || !r.manual) return;

  try { await api('/api/proxy-pool/nodes/manual?name=' + encodeURIComponent(r.name), { method: 'DELETE' }); toast('已删除', 'ok'); viewProxy(); }
  catch (e) { toast(e.message, 'bad'); }
}


/* ══════════════════════════════════════════════ 内核一键安装
 *
 * 桌面版 / Docker 里不预装 mihomo（GPL-3.0，61 MB），
 * 这里点一下就从官方发布页下载到数据目录，装完自动启用。
 */
let CORE_TIMER = null;

function corePct(j) {
  const p = Math.max(0, Math.min(100, Number(j && j.pct) || 0));
  return `<div style="height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:10px">
    <div style="height:100%;width:${p}%;background:linear-gradient(90deg,var(--acc),#34d399);transition:width .3s"></div>
  </div>`;
}

function renderCore(st) {
  const box = $('#coreBox');
  if (!box) return;
  const j = (st && st.job) || {};
  const installed = !!(st && st.installed);
  const running = !!j.running;

  const badge = installed
    ? `<span class="b ok">已安装</span> <span class="mono" style="font-size:11px">${esc(st.version || '')}</span>`
    : (st && st.exists
        ? '<span class="b warn">文件存在但无法执行</span>'
        : '<span class="b dim">未安装</span>');

  const info = installed
    ? `<div class="sub" style="margin-top:6px;font-size:11px" class="mono">${esc(st.path)} · ${(st.sizeBytes / 1048576).toFixed(1)} MB · ${esc(st.platform)}</div>`
    : `<div class="sub" style="margin-top:6px;font-size:11px">装好后才能启用节点池。mihomo 为 GPL-3.0，与本项目 MIT 相互独立。</div>`;

  const progress = running
    ? `<div style="margin-top:6px"><span class="sub">${esc(j.message || '准备中…')}</span>${corePct(j)}</div>
       ${(j.log && j.log.length) ? `<div class="mono" style="margin-top:8px;font-size:11px;color:var(--dim);max-height:120px;overflow:auto">${j.log.slice(-8).map((l) => esc(l)).join('<br>')}</div>` : ''}`
    : (j.error ? `<div style="margin-top:6px;color:var(--warn);font-size:12px">✗ ${esc(j.error)}</div>` : '')
      + (j.ok ? `<div style="margin-top:6px;color:var(--acc);font-size:12px">✓ ${esc(j.message || '安装成功')}</div>` : '');

  box.innerHTML = `<div class="panel" style="padding:14px 16px">
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <div style="font-weight:600">mihomo 内核</div>
      <div>${badge}</div>
      <div style="margin-left:auto;display:flex;gap:8px">
        ${installed
          ? '<button class="sm" onclick="loadCore()">刷新</button>'
          : `<button class="sm primary" ${running ? 'disabled' : ''} onclick="installCoreNow()">${running ? '安装中…' : '⬇ 一键安装内核'}</button>`}
        <button class="sm" onclick="useExistingCore()">使用已有内核</button>
      </div>
    </div>
    ${info}${progress}
    <details style="margin-top:10px"${(st && st.mirrors) ? '' : ' open'}>
      <summary style="cursor:pointer;font-size:12px;color:var(--dim)">下载镜像${(st && st.mirrors) ? '（已配置）' : '（未配置 —— 只走 GitHub 官方直连）'}</summary>
      <div class="sub" style="margin-top:6px;font-size:11px">
        网络慢或被墙时在这里填加速地址；<code class="mono">{}</code> 代表原始 URL 的位置。
        <b>本项目不预置任何第三方镜像</b> —— 流量经过谁的服务器应该由你自己决定。
      </div>
      <textarea id="coreMirrors" rows="2" class="mono" style="width:100%;margin-top:6px" placeholder="https://你的镜像前缀/{}">${esc((st && st.mirrors) || '')}</textarea>
      <button class="sm" style="margin-top:6px" onclick="saveMirrors()">保存镜像</button>
    </details>
  </div>`;

  if (running && !CORE_TIMER) CORE_TIMER = setTimeout(pollCore, 900);
}

async function pollCore() {
  CORE_TIMER = null;
  if (!$('#coreBox')) return;                 // 已经离开这一页，停止轮询
  let st = null;
  try { st = await api('/api/proxy-pool/core'); } catch { /* 忽略，下次再试 */ }
  if (!st) { CORE_TIMER = setTimeout(pollCore, 2000); return; }
  renderCore(st);
  if (st.job && st.job.running) { CORE_TIMER = setTimeout(pollCore, 900); return; }
  // 装完了：让节点池用上新内核
  if (st.job && st.job.ok) { toast('内核已就绪，正在启用节点池…', 'ok'); setTimeout(() => viewProxy(), 1200); }
}

async function loadCore() {
  const box = $('#coreBox');
  if (!box) return;
  box.innerHTML = '<div class="panel" style="padding:14px 16px"><span class="sub">读取内核状态…</span></div>';
  try { renderCore(await api('/api/proxy-pool/core')); }
  catch (e) { box.innerHTML = `<div class="panel" style="padding:14px 16px"><b>mihomo 内核</b> <span class="b bad">状态获取失败：${esc(e.message)}</span></div>`; }
}

async function installCoreNow() {
  if (!confirm('将从 GitHub 官方发布页下载 mihomo 内核（约 15-30 MB，具体看平台）到数据目录。\n\nmihomo 为 GPL-3.0 授权，与本项目 MIT 相互独立。继续？')) return;
  try {
    const r = await api('/api/proxy-pool/core/install', { method: 'POST', body: {} });
    if (r.busy) { toast('已经在安装了', 'warn'); }
    else toast('开始下载…', 'ok');
    if (!CORE_TIMER) CORE_TIMER = setTimeout(pollCore, 700);
  } catch (e) { toast(e.message, 'bad'); }
}

/** 保存下载镜像（不内置任何镜像，全由用户填） */
async function saveMirrors() {
  const raw = $('#coreMirrors').value;
  try {
    const r = await api('/api/proxy-pool/core', { method: 'POST', body: { mirrors: raw } });
    toast(r.mirrors.length ? `已保存 ${r.mirrors.length} 个镜像` : '已清空镜像（只走官方直连）', 'ok');
    loadCore();
  } catch (e) { toast(e.message, 'bad'); }
}

async function useExistingCore() {
  const p = prompt('填入已有 mihomo / verge-mihomo 可执行文件的完整路径\n（例如 Clash Verge 自带的 verge-mihomo.exe）');
  if (!p) return;
  try {
    const r = await api('/api/proxy-pool/core/use', { method: 'POST', body: { path: p.trim() } });
    toast('已启用：' + (r.version || 'ok'), 'ok');
    viewProxy();
  } catch (e) { toast(e.message, 'bad'); }
}


/* ══════════════════════════════════════════════ 配置备份 / 恢复 / Clash 迁移 */
function exportCfg(withTokens) {
  const q = '/api/config/export?download=1&pool=1&tokens=' + (withTokens ? '1' : '0');
  if (withTokens && !confirm('导出内容会包含**令牌明文**（sk-oc-…），拿到文件的人可以直接用你的额度。\n\n确定要导出吗？')) return;
  toast(withTokens ? '正在导出（含令牌）…' : '正在导出…');
  // 用 a[download] 走浏览器下载，避免整页跳转
  const a = document.createElement('a');
  a.href = q;
  a.download = '';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

async function importCfg() {
  const f = $('#cfgFile');
  if (!f || !f.files || !f.files[0]) return toast('先选一个 .json 备份文件', 'bad');
  const replace = $('#cfgReplace').checked;
  if (replace && !confirm('整份替换会**先清空现有渠道与订阅**再导入。\n\n确定继续？')) return;
  let bundle = null;
  try { bundle = JSON.parse(await f.files[0].text()); }
  catch { return toast('文件不是合法 JSON', 'bad'); }
  if (bundle && bundle.kind && bundle.kind !== 'opencode-free-gateway/config') return toast('不是本项目的配置文件', 'bad');
  try {
    toast('正在恢复…');
    const r = await api('/api/config/import', { method: 'POST', body: { bundle, mode: replace ? 'replace' : 'merge' } });
    toast(`恢复完成：渠道 ${r.channels} · 令牌 ${r.tokens} · 订阅 ${r.providers} · 手加节点 ${r.manualProxies}${r.tokensSkipped ? ' · 跳过重复令牌 ' + r.tokensSkipped : ''}`, 'ok');
    viewSettings();
  } catch (e) { toast(e.message, 'bad'); }
}

async function importClash(dryRun) {
  const ta = $('#clashText');
  const box = $('#clashResult');
  const text = ta ? ta.value : '';
  if (!text.trim()) return toast('先粘贴 Clash 配置内容', 'bad');
  if (!dryRun && !confirm('会把这些条目写进「代理订阅」页，然后重渲染内核配置。\n\n继续？')) return;
  if (box) box.textContent = dryRun ? '正在解析…' : '正在导入…';
  try {
    const r = await api('/api/config/import-clash', { method: 'POST', body: { yaml: text, dryRun, mode: 'merge' } });
    if (dryRun) {
      if (box) box.innerHTML = `<span class="b ok">解析成功</span> 订阅 ${r.providers} 个 · 节点 ${r.proxies} 个${r.skippedProxies ? '（跳过 ' + r.skippedProxies + ' 个字段不全的）' : ''}
        ${r.preview && r.preview.providers.length ? '<div class="mono" style="margin-top:6px;font-size:11px">订阅：' + r.preview.providers.map((x) => esc(x)).join(', ') + '</div>' : ''}
        ${r.preview && r.preview.proxies.length ? '<div class="mono" style="margin-top:4px;font-size:11px">节点：' + r.preview.proxies.map((x) => esc(x)).join(', ') + (r.proxies > 20 ? ' …' : '') + '</div>' : ''}`;
      toast('解析完成，确认无误后点「导入」', 'ok');
    } else {
      toast(`已导入：订阅 +${r.addedProviders} · 节点 +${r.addedProxies}（现共 订阅 ${r.totalProviders} / 节点 ${r.totalManual}）`, 'ok');
      if (box) box.innerHTML = '<span class="b ok">已导入</span> 到「代理订阅」页后点「应用改动」让内核重载';
    }
  } catch (e) {
    if (box) box.innerHTML = `<span class="b bad">${esc(e.message)}</span>`;
    toast(e.message, 'bad');
  }
}


/* ══════════════════════════════════════════════ OpenCode 会话池
 *
 * 上游要求 x-opencode-session 是**真实存在过的会话**，随机生成的格式再对也 403。
 * 这里管理一个池子（存配置文件），支持自动扫描本机 + 手动添加 + 指定当前使用。
 */
let SESS_STATE = { rows: [], active: '', configPath: '' };

async function loadSessions() {
  const box = $('#sessBox');
  if (!box) return;
  try {
    const r = await api('/api/sessions');
    SESS_STATE = r;
    renderSessions();
  } catch (e) {
    box.innerHTML = `<div class="panel" style="padding:14px 16px"><b>会话池</b> <span class="b bad">读取失败：${esc(e.message)}</span></div>`;
  }
}

function renderSessions() {
  const box = $('#sessBox');
  if (!box) return;
  const rows = SESS_STATE.rows || [];
  const active = SESS_STATE.active || '';
  const okCount = rows.filter((r) => r.lastOkAt > (r.lastFailAt || 0)).length;

  box.innerHTML = `<div class="panel"><h3>OpenCode 会话池
      <span class="sub" style="font-weight:400">${rows.length} 个 · 当前 <code class="mono">${esc(active || '无')}</code></span>
    </h3><div class="body">
    <div class="sub" style="font-size:12px">
      上游要求 <code class="mono">x-opencode-session</code> 是**真实存在过的会话** ——
      格式正确但从未出现过的 id 一律 403。池子里的会话可长期复用，不分新旧。
    </div>
    <div class="sub" style="font-size:11px;margin-top:6px">配置文件：<code class="mono">${esc(SESS_STATE.configPath || '')}</code></div>
    <div class="toolbar" style="margin-top:10px">
      <button class="primary" onclick="addSession()">＋ 手动添加</button>
      <button onclick="scanSessions()">扫描本机</button>
      <button onclick="testSessions()">测试全部</button>
      <button onclick="loadSessions()">刷新</button>
    </div>
    <div id="sessResult" class="sub" style="font-size:12px;margin-top:6px"></div>
    <div class="tbl-wrap" style="margin-top:10px"><table>
      <thead><tr><th>session</th><th>来源</th><th>最近结果</th><th style="width:200px">操作</th></tr></thead>
      <tbody>${rows.length ? rows.map((r, i) => `<tr>
        <td class="mono" style="font-size:11px">${esc(r.id)}${r.id === active ? ' <span class="b ok">当前</span>' : ''}</td>
        <td><span class="b dim">${esc(r.source || 'manual')}</span>${r.note ? ' <span class="sub">' + esc(r.note) + '</span>' : ''}</td>
        <td>${r.lastOkAt && r.lastOkAt >= (r.lastFailAt || 0) ? '<span class="b ok">可用</span>' : (r.lastFailAt ? '<span class="b bad">失败 ' + (r.failCount || 1) + ' 次</span>' : '<span class="b dim">未测试</span>')}</td>
        <td>
          ${r.id === active ? '' : `<button class="sm" onclick="setActiveSession(${i})">设为当前</button>`}
          <button class="sm" onclick="testSessions(${i})">测试</button>
          <button class="sm danger" onclick="delSession(${i})">删除</button>
        </td>
      </tr>`).join('') : '<tr><td colspan="4" class="empty">池子是空的 —— 点「扫描本机」从 OpenCode 存储里导入</td></tr>'}</tbody>
    </table></div>
  </div></div>`;
}

function addSession() {
  const id = prompt('粘贴一个 OpenCode 会话 id\n格式：ses_ + 12 位 hex + 14 位字母数字\n\n可以从 ~/.local/share/opencode/storage/ 里找');
  if (!id) return;
  api('/api/sessions', { method: 'POST', body: { id: id.trim(), note: '手动添加' } })
    .then((r) => { toast(r.added ? '已添加' : '已存在', r.added ? 'ok' : ''); loadSessions(); })
    .catch((e) => toast(e.message, 'bad'));
}

async function scanSessions() {
  const out = $('#sessResult');
  if (out) out.textContent = '正在扫描本机 OpenCode 存储…';
  try {
    const r = await api('/api/sessions/scan', { method: 'POST', body: {} });
    if (out) out.innerHTML = `<span class="b ok">扫描完成</span> 找到 ${r.found} 个，新增 ${r.added} 个，池子共 ${r.total} 个`;
    toast(`新增 ${r.added} 个会话`, 'ok');
    loadSessions();
  } catch (e) { toast(e.message, 'bad'); if (out) out.textContent = e.message; }
}

async function testSessions(idx) {
  const out = $('#sessResult');
  const one = typeof idx === 'number' ? SESS_STATE.rows[idx] : null;
  if (out) out.textContent = one ? `正在测试 ${one.id}…` : '正在逐个测试（每个都要打一次上游，慢一点）…';
  try {
    const r = await api('/api/sessions/test', { method: 'POST', body: one ? { id: one.id } : {} });
    const bad = (r.results || []).filter((x) => !x.ok);
    if (out) {
      out.innerHTML = `<span class="b ${r.okCount ? 'ok' : 'bad'}">${r.okCount}/${r.total} 可用</span>`
        + (bad.length ? '<div class="mono" style="font-size:11px;margin-top:4px">失败：' + bad.map((x) => esc(x.id.slice(0, 22)) + ' (' + esc(x.error || x.status) + ')').join('<br>') + '</div>' : '');
    }
    toast(`${r.okCount}/${r.total} 个会话可用`, r.okCount ? 'ok' : 'bad');
    loadSessions();
  } catch (e) { toast(e.message, 'bad'); if (out) out.textContent = e.message; }
}

async function setActiveSession(idx) {
  const r = SESS_STATE.rows[idx];
  if (!r) return;
  try { await api('/api/sessions/active', { method: 'POST', body: { id: r.id } }); toast('已切换', 'ok'); loadSessions(); }
  catch (e) { toast(e.message, 'bad'); }
}

async function delSession(idx) {
  const r = SESS_STATE.rows[idx];
  if (!r || !confirm('从池子里删除这个会话？\n' + r.id)) return;
  try { await api('/api/sessions?id=' + encodeURIComponent(r.id), { method: 'DELETE' }); toast('已删除', 'ok'); loadSessions(); }
  catch (e) { toast(e.message, 'bad'); }
}


boot();
</script>
</body>
</html>
