<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenCode 免费层网关</title>
<style>
:root{
  --bg:#0d1117; --bg2:#161b22; --bg3:#1c2230; --line:#2a3140; --fg:#e6edf3; --dim:#8b949e;
  --acc:#3b82f6; --acc2:#1f6feb; --ok:#3fb950; --warn:#d29922; --bad:#f85149; --pur:#a371f7;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
.hidden{display:none!important}
a{color:var(--acc);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--bg3);padding:7px 13px;border-radius:8px;transition:.15s}
button:hover{border-color:var(--acc);background:#22304a}
button.primary{background:var(--acc2);border-color:var(--acc2);color:#fff}
button.primary:hover{background:#2d7ff0}
button.danger{color:var(--bad);border-color:#5a2a2a}
button.danger:hover{background:#3a1d1d;border-color:var(--bad)}
button.sm{padding:4px 9px;font-size:12px;border-radius:6px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 11px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
label{display:block;font-size:12px;color:var(--dim);margin:12px 0 5px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}

/* 登录 */
.login-wrap{height:100%;display:grid;place-items:center}
.login{width:340px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:28px}
.login h1{margin:0 0 4px;font-size:19px}
.login p{margin:0 0 18px;color:var(--dim);font-size:12px}

/* 布局 */
.app{display:grid;grid-template-columns:212px 1fr;height:100%}
aside{background:var(--bg2);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px}
.brand{font-weight:600;padding:6px 10px 16px;font-size:15px;display:flex;align-items:center;gap:8px}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
nav a{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;color:var(--dim);cursor:pointer}
nav a:hover{background:var(--bg3);color:var(--fg)}
nav a.on{background:var(--bg3);color:var(--fg);box-shadow:inset 2px 0 0 var(--acc)}
nav a span{font-size:15px;width:18px;text-align:center}
.side-foot{margin-top:auto;font-size:11px;color:var(--dim);padding:10px}
main{overflow:auto;padding:22px 26px 60px}
h2{margin:0 0 4px;font-size:19px}
.sub{color:var(--dim);font-size:12px;margin-bottom:18px}

/* 卡片 */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.card .k{font-size:11px;color:var(--dim);letter-spacing:.04em}
.card .v{font-size:23px;font-weight:600;margin-top:5px}
.card .v small{font-size:12px;color:var(--dim);font-weight:400}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.panel>h3{margin:0;padding:12px 16px;font-size:13px;border-bottom:1px solid var(--line);color:var(--dim);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.panel .body{padding:14px 16px}

/* 表格 */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--dim);font-weight:500;font-size:11.5px;letter-spacing:.03em;background:#12171f}
tbody tr:hover{background:#161d29}
td.wrap{white-space:normal;max-width:420px;word-break:break-all}
.tbl-wrap{overflow:auto;max-height:640px}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}

/* 徽章 */
.b{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;border:1px solid}
.b.ok{color:var(--ok);border-color:#1f4429;background:#0f2417}
.b.bad{color:var(--bad);border-color:#5a2a2a;background:#2a1414}
.b.warn{color:var(--warn);border-color:#4d3b12;background:#241d0c}
.b.dim{color:var(--dim);border-color:var(--line);background:var(--bg3)}
.b.acc{color:var(--acc);border-color:#1b3a63;background:#0f1d31}

/* 图表 */
.chart{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:8px}
.chart .bar{flex:1;min-width:14px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;position:relative}
.chart .bar i{width:100%;background:linear-gradient(180deg,var(--acc),#1b4b8f);border-radius:4px 4px 0 0;min-height:2px;transition:.2s}
.chart .bar:hover i{background:linear-gradient(180deg,#60a5fa,#2563eb)}
.chart .bar em{font-size:10px;color:var(--dim);font-style:normal}
.chart .bar b{position:absolute;top:-16px;font-size:10px;color:var(--dim);font-weight:400}

/* 模态 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:grid;place-items:center;z-index:50;padding:20px}
.modal .box{background:var(--bg2);border:1px solid var(--line);border-radius:14px;width:min(560px,100%);max-height:88vh;overflow:auto;padding:22px}
.modal h3{margin:0 0 6px;font-size:16px}
.modal .foot{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px;overflow:auto;font-size:12px;margin:8px 0 0;max-height:260px;white-space:pre-wrap;word-break:break-all}

/* toast */
#toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:9px;z-index:99}
.toast{background:var(--bg3);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:8px;padding:11px 15px;font-size:13px;animation:in .2s;max-width:380px;box-shadow:0 8px 26px rgba(0,0,0,.45)}
.toast.ok{border-left-color:var(--ok)} .toast.bad{border-left-color:var(--bad)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.empty{color:var(--dim);text-align:center;padding:34px;font-size:13px}
.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar input,.toolbar select{width:auto;min-width:130px}
</style>
</head>
<body>

<div id="login" class="login-wrap hidden">
  <div class="login">
    <h1>OpenCode 免费层网关</h1>
    <p id="loginSub">请输入管理密码</p>
    <label>密码</label>
    <input id="pw" type="password" placeholder="admin123" autocomplete="current-password">
    <div style="height:18px"></div>
    <button class="primary" style="width:100%" onclick="doLogin()">登录</button>
  </div>
</div>

<div id="app" class="app hidden">
  <aside>
    <div class="brand"><i></i><span id="brandName">免费层网关</span></div>
    <nav id="nav">
      <a data-r="dashboard"><span>◈</span>仪表盘</a>
      <a data-r="channels"><span>☰</span>渠道管理</a>
      <a data-r="tokens"><span>⚿</span>令牌管理</a>
      <a data-r="models"><span>✦</span>模型列表</a>
      <a data-r="logs"><span>≡</span>请求日志</a>
      <a data-r="settings"><span>⚙</span>系统设置</a>
    </nav>
    <div class="side-foot">
      <div id="ver">v1.0</div>
      <div style="margin-top:6px"><a onclick="doLogout()" style="cursor:pointer">退出登录</a></div>
    </div>
  </aside>
  <main id="main"></main>
</div>

<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"></div>
<div id="toast"></div>

<script>
/* ══════════════════════════════════════════════ 基础 */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtN = (n) => (n ?? 0).toLocaleString('en-US');
const fmtT = (t) => t ? new Date(t).toLocaleString('zh-CN', { hour12: false }) : '-';
const ago = (t) => { if (!t) return '-'; const d = Date.now() - t; if (d < 6e4) return Math.round(d / 1000) + 's 前'; if (d < 36e5) return Math.round(d / 6e4) + 'm 前'; if (d < 864e5) return Math.round(d / 36e5) + 'h 前'; return Math.round(d / 864e5) + 'd 前'; };
const dur = (ms) => ms == null ? '-' : ms < 1000 ? ms + 'ms' : (ms / 1000).toFixed(2) + 's';

function toast(msg, kind = '') {
  const d = document.createElement('div');
  d.className = 'toast ' + kind;
  d.textContent = msg;
  $('#toast').appendChild(d);
  setTimeout(() => d.remove(), 4200);
}

async function api(path, opts = {}) {
  const r = await fetch(path, {
    credentials: 'same-origin',
    headers: { 'content-type': 'application/json' },
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (r.status === 401 && !path.includes('login')) { showLogin(); throw new Error('未登录'); }
  const t = await r.text();
  let j = null; try { j = JSON.parse(t); } catch {}
  if (!r.ok) throw new Error(j?.error?.message || j?.error || t.slice(0, 200) || ('HTTP ' + r.status));
  return j;
}

/* ══════════════════════════════════════════════ 登录 */
async function boot() {
  try {
    const me = await api('/api/me');
    if (me.site_name) $('#brandName').textContent = me.site_name;
    if (me.admin) { showApp(); return; }
  } catch {}
  showLogin();
}
function showLogin() { $('#login').classList.remove('hidden'); $('#app').classList.add('hidden'); }
function showApp() { $('#login').classList.add('hidden'); $('#app').classList.remove('hidden'); route(); }
async function doLogin() {
  const pw = $('#pw').value;
  try { await api('/api/login', { method: 'POST', body: { password: pw } }); showApp(); }
  catch (e) { toast(e.message, 'bad'); }
}
async function doLogout() { await api('/api/logout', { method: 'POST' }).catch(() => {}); showLogin(); }
$('#pw')?.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });

/* ══════════════════════════════════════════════ 路由 */
let ROUTE = 'dashboard';
document.addEventListener('click', (e) => {
  const a = e.target.closest('nav a'); if (!a) return;
  ROUTE = a.dataset.r;
  document.querySelectorAll('nav a').forEach((x) => x.classList.toggle('on', x === a));
  route();
});
function route() {
  document.querySelectorAll('nav a').forEach((x) => x.classList.toggle('on', x.dataset.r === ROUTE));
  ({ dashboard: viewDashboard, channels: viewChannels, tokens: viewTokens, models: viewModels, logs: viewLogs, settings: viewSettings }[ROUTE] || viewDashboard)();
}
const M = (html) => { $('#main').innerHTML = html; };

/* ══════════════════════════════════════════════ 仪表盘 */
async function viewDashboard() {
  M('<h2>仪表盘</h2><div class="sub">加载中…</div>');
  const s = await api('/api/stats?range=all').catch((e) => { M('<div class="empty">' + esc(e.message) + '</div>'); return null; });
  if (!s) return;
  const rate = s.total ? (s.ok / s.total * 100).toFixed(1) : '0.0';
  const maxDay = Math.max(1, ...s.byDay.map((d) => d.n));
  M(`
  <h2>仪表盘</h2>
  <div class="sub">累计请求与上游用量总览</div>
  <div class="cards">
    <div class="card"><div class="k">总请求</div><div class="v">${fmtN(s.total)}</div></div>
    <div class="card"><div class="k">成功率</div><div class="v" style="color:${rate >= 95 ? 'var(--ok)' : rate >= 80 ? 'var(--warn)' : 'var(--bad)'}">${rate}<small>%</small></div></div>
    <div class="card"><div class="k">总 TOKEN</div><div class="v">${fmtN(s.tokens)}</div></div>
    <div class="card"><div class="k">平均延迟</div><div class="v">${s.avgMs}<small>ms</small></div></div>
    <div class="card"><div class="k">渠道 / 令牌</div><div class="v">${s.channels}<small> / ${s.tokens}</small></div></div>
  </div>

  <div class="panel"><h3>近 14 天请求量</h3><div class="body">
    ${s.byDay.length ? `<div class="chart">${[...s.byDay].reverse().map((d) => `
      <div class="bar" title="${d.d} · ${d.n} 次 · ${d.ok} 成功 · ${fmtN(d.tk)} tokens">
        <b>${d.n}</b><i style="height:${Math.max(2, d.n / maxDay * 100)}%"></i><em>${d.d.slice(5)}</em>
      </div>`).join('')}</div>` : '<div class="empty">暂无数据</div>'}
  </div></div>

  <div class="panel"><h3>按模型</h3><div class="tbl-wrap"><table>
    <thead><tr><th>模型</th><th>请求</th><th>成功</th><th>成功率</th><th>TOKEN</th><th>平均延迟</th></tr></thead>
    <tbody>${s.byModel.length ? s.byModel.map((m) => `<tr>
      <td class="mono">${esc(m.model || '-')}</td><td>${fmtN(m.n)}</td><td>${fmtN(m.ok)}</td>
      <td>${m.n ? (m.ok / m.n * 100).toFixed(1) : 0}%</td><td>${fmtN(m.tk)}</td><td>${Math.round(m.avg_ms || 0)}ms</td>
    </tr>`).join('') : '<tr><td colspan="6" class="empty">暂无数据</td></tr>'}</tbody>
  </table></div></div>

  <div class="panel"><h3>按渠道</h3><div class="tbl-wrap"><table>
    <thead><tr><th>渠道</th><th>请求</th><th>成功</th><th>平均延迟</th></tr></thead>
    <tbody>${s.byChannel.length ? s.byChannel.map((c) => `<tr>
      <td>${esc(c.channel_name || '-')}</td><td>${fmtN(c.n)}</td><td>${fmtN(c.ok)}</td><td>${Math.round(c.avg_ms || 0)}ms</td>
    </tr>`).join('') : '<tr><td colspan="4" class="empty">暂无数据</td></tr>'}</tbody>
  </table></div></div>

  ${s.cooldowns?.length ? `<div class="panel"><h3>模型冷却中 <button class="sm" onclick="clearCd()">全部解除</button></h3><div class="body">
    ${s.cooldowns.map((c) => `<span class="b warn" style="margin:3px">${esc(c.key)} · ${Math.round(c.leftMs / 60000)}m</span>`).join('')}
  </div></div>` : ''}

  ${s.errors?.length ? `<div class="panel"><h3>失败分布</h3><div class="tbl-wrap"><table>
    <thead><tr><th>状态</th><th>错误</th><th>次数</th></tr></thead>
    <tbody>${s.errors.map((e) => `<tr><td><span class="b bad">${e.status || '网络'}</span></td><td class="wrap mono">${esc(e.error || '')}</td><td>${e.n}</td></tr>`).join('')}</tbody>
  </table></div></div>` : ''}
  `);
}
async function clearCd() { await api('/api/cooldowns', { method: 'DELETE' }); toast('已解除全部冷却', 'ok'); viewDashboard(); }

/* ══════════════════════════════════════════════ 渠道 */
async function viewChannels() {
  M('<h2>渠道管理</h2><div class="sub">加载中…</div>');
  const { rows } = await api('/api/channels');
  M(`
  <h2>渠道管理</h2>
  <div class="sub">opencode 类型使用免费层形状请求；openai 类型为通用 OpenAI 兼容上游</div>
  <div class="toolbar">
    <button class="primary" onclick="editChannel()">+ 添加渠道</button>
    <button onclick="viewChannels()">刷新</button>
  </div>
  <div class="panel"><div class="tbl-wrap"><table>
    <thead><tr><th>ID</th><th>名称</th><th>类型</th><th>模型</th><th>代理</th><th>优先级</th><th>状态</th><th>操作</th></tr></thead>
    <tbody>${rows.length ? rows.map((c) => `<tr>
      <td>${c.id}</td>
      <td><b>${esc(c.name)}</b><div style="font-size:11px;color:var(--dim)" class="mono">${esc(c.base_url || '')}</div></td>
      <td><span class="b ${c.type === 'opencode' ? 'acc' : 'dim'}">${esc(c.type)}</span></td>
      <td>${c.models.length} 个<div style="font-size:11px;color:var(--dim)" class="mono">${esc(c.models.slice(0, 2).join(', '))}${c.models.length > 2 ? ' …' : ''}</div></td>
      <td class="mono" style="font-size:11px">${esc(c.proxy || '直连')}</td>
      <td>${c.priority}</td>
      <td>${c.status ? (c.down ? `<span class="b warn" title="${esc(c.disabled_reason || '')}">冷却中</span>` : '<span class="b ok">启用</span>') : '<span class="b bad">禁用</span>'}</td>
      <td>
        <button class="sm" onclick="testChannel(${c.id})">测试</button>
        <button class="sm" onclick="editChannel(${c.id})">编辑</button>
        <button class="sm" onclick="toggleChannel(${c.id})">${c.status ? '禁用' : '启用'}</button>
        <button class="sm danger" onclick="delChannel(${c.id})">删除</button>
      </td>
    </tr>`).join('') : '<tr><td colspan="8" class="empty">还没有渠道，点「添加渠道」开始</td></tr>'}</tbody>
  </table></div></div>`);
}

const FREE_MODELS = ['deepseek-v4.1-flash-free','longcat-2.5-preview-free','space-bunny-free','mimo-v2.6-flash-free','nemotron-3.5-lightning-free','nemotron-3.5-super-vl-free','nemotron-3-ultra-free','big-pickle','muse-spark-1.3-contributor-free','cat-jam-free'];

async function editChannel(id) {
  let c = { name: '', type: 'opencode', base_url: 'https://opencode.ai/inference/v1/chat/completions', api_key: 'public', models: FREE_MODELS.slice(), proxy: '', priority: 0, extra: {} };
  if (id) c = await api('/api/channels/' + id);
  openModal(`
    <h3>${id ? '编辑' : '添加'}渠道</h3>
    <label>名称</label><input id="f_name" value="${esc(c.name)}" placeholder="OpenCode 免费层">
    <label>类型</label>
    <select id="f_type">
      <option value="opencode"${c.type === 'opencode' ? ' selected' : ''}>opencode（免费层形状请求）</option>
      <option value="openai"${c.type === 'openai' ? ' selected' : ''}>openai（通用 OpenAI 兼容）</option>
    </select>
    <label>上游地址</label>
    <input id="f_url" value="${esc(c.base_url || '')}" placeholder="https://opencode.ai/inference/v1/chat/completions">
    <label>API Key（opencode 类型填 public 即可）</label><input id="f_key" value="${esc(c.api_key || '')}">
    <label>模型列表（每行一个）</label>
    <textarea id="f_models" rows="7" class="mono">${esc(c.models.join('\n'))}</textarea>
    <div class="row" style="margin-top:8px">
      <button class="sm" onclick="fillFree()">填入免费模型</button>
      <button class="sm" onclick="fillFree(true)">只填已探明可用</button>
    </div>
    <label>代理（可逗号分隔多节点，留空直连）</label>
    <input id="f_proxy" class="mono" value="${esc(c.proxy || '')}" placeholder="http://127.0.0.1:7897,socks5://127.0.0.1:7897">
    <label>优先级（大的优先）</label><input id="f_pri" type="number" value="${c.priority ?? 0}">
    <label>自定义 User-Agent（留空用内置）</label><input id="f_ua" class="mono" value="${esc(c.extra?.ua || '')}">
    <div class="foot"><button onclick="closeModal()">取消</button><button class="primary" onclick="saveChannel(${id || 0})">保存</button></div>
  `);
}
function fillFree(proven) {
  const list = proven
    ? ['deepseek-v4.1-flash-free','longcat-2.5-preview-free']
    : FREE_MODELS;
  $('#f_models').value = list.join('\n');
}
async function saveChannel(id) {
  const body = {
    name: $('#f_name').value.trim() || '未命名渠道',
    type: $('#f_type').value,
    base_url: $('#f_url').value.trim(),
    api_key: $('#f_key').value.trim(),
    models: $('#f_models').value.split(/\r?\n/).map((s) => s.trim()).filter(Boolean),
    proxy: $('#f_proxy').value.trim(),
    priority: Number($('#f_pri').value || 0),
    extra: { ua: $('#f_ua').value.trim() || undefined },
  };
  try {
    if (id) await api('/api/channels/' + id, { method: 'PUT', body });
    else await api('/api/channels', { method: 'POST', body });
    closeModal(); toast('已保存', 'ok'); viewChannels();
  } catch (e) { toast(e.message, 'bad'); }
}
async function delChannel(id) { if (!confirm('确定删除该渠道？')) return; await api('/api/channels/' + id, { method: 'DELETE' }); toast('已删除', 'ok'); viewChannels(); }
async function toggleChannel(id) { await api('/api/channels/' + id + '/toggle', { method: 'POST' }); viewChannels(); }
async function testChannel(id) {
  toast('正在测试…');
  try {
    const r = await api('/api/channels/' + id + '/test', { method: 'POST', body: {} });
    toast(`${r.model} → HTTP ${r.status} ${r.ok ? '✓ 可用' : '✗ ' + r.body.slice(0, 80)}`, r.ok ? 'ok' : 'bad');
    viewChannels();
  } catch (e) { toast(e.message, 'bad'); }
}

/* ══════════════════════════════════════════════ 令牌 */
async function viewTokens() {
  M('<h2>令牌管理</h2><div class="sub">加载中…</div>');
  const { rows } = await api('/api/tokens');
  M(`
  <h2>令牌管理</h2>
  <div class="sub">客户端用这些密钥访问 <span class="mono">/v1/chat/completions</span></div>
  <div class="toolbar">
    <button class="primary" onclick="editToken()">+ 新建令牌</button>
    <button onclick="viewTokens()">刷新</button>
  </div>
  <div class="panel"><div class="tbl-wrap"><table>
    <thead><tr><th>ID</th><th>名称</th><th>密钥</th><th>额度</th><th>模型限制</th><th>过期</th><th>状态</th><th>操作</th></tr></thead>
    <tbody>${rows.length ? rows.map((t) => `<tr>
      <td>${t.id}</td>
      <td><b>${esc(t.name)}</b><div style="font-size:11px;color:var(--dim)">最后使用 ${ago(t.last_used)}</div></td>
      <td class="mono" style="font-size:11px">${esc(t.key.slice(0, 14))}…
        <button class="sm" onclick="copy('${esc(t.key)}')">复制</button></td>
      <td>${t.unlimited ? '<span class="b acc">不限</span>' : `${t.used} / ${t.quota}`}</td>
      <td>${(() => { const m = JSON.parse(t.models || '[]'); return m.length ? esc(m.join(', ')) : '<span class="b dim">全部</span>'; })()}</td>
      <td>${t.expires_at ? fmtT(t.expires_at) : '<span class="b dim">永久</span>'}</td>
      <td>${t.status ? '<span class="b ok">启用</span>' : '<span class="b bad">禁用</span>'}</td>
      <td>
        <button class="sm" onclick="editToken(${t.id})">编辑</button>
        <button class="sm" onclick="resetToken(${t.id})">重置用量</button>
        <button class="sm danger" onclick="delToken(${t.id})">删除</button>
      </td>
    </tr>`).join('') : '<tr><td colspan="8" class="empty">还没有令牌，点「新建令牌」开始</td></tr>'}</tbody>
  </table></div></div>
  <div class="panel"><h3>客户端接入示例</h3><div class="body"><pre>${esc(`# OpenAI 官方 SDK
from openai import OpenAI
client = OpenAI(base_url="http://127.0.0.1:8790/v1", api_key="<你的令牌>")
print(client.chat.completions.create(model="auto", messages=[{"role":"user","content":"你好"}]).choices[0].message.content)

# curl
curl http://127.0.0.1:8790/v1/chat/completions \\
  -H "Authorization: Bearer <你的令牌>" -H "Content-Type: application/json" \\
  -d '{"model":"auto","messages":[{"role":"user","content":"你好"}]}'`)}</pre>
    <div style="color:var(--dim);font-size:12px;margin-top:8px">model 填 <span class="mono">auto</span> 时自动在所有渠道的模型间轮转，遇 429 自动换下一个。</div>
  </div></div>`);
}
async function editToken(id) {
  let t = { name: '', quota: 0, unlimited: true, models: [], expires_at: 0, status: 1 };
  if (id) t = (await api('/api/tokens')).rows.find((x) => x.id === id);
  t.models = JSON.parse(t.models || '[]');
  openModal(`
    <h3>${id ? '编辑' : '新建'}令牌</h3>
    <label>名称</label><input id="t_name" value="${esc(t.name)}" placeholder="我的客户端">
    <label>额度模式</label>
    <select id="t_unl"><option value="1"${t.unlimited ? ' selected' : ''}>不限制</option><option value="0"${!t.unlimited ? ' selected' : ''}>限制次数</option></select>
    <label>额度（次数，仅「限制次数」时生效）</label><input id="t_quota" type="number" value="${t.quota || 0}">
    <label>模型白名单（每行一个，留空=全部）</label><textarea id="t_models" rows="4" class="mono">${esc(t.models.join('\n'))}</textarea>
    <label>过期时间（留空=永久）</label><input id="t_exp" type="datetime-local">
    <label>状态</label><select id="t_status"><option value="1"${t.status ? ' selected' : ''}>启用</option><option value="0"${!t.status ? ' selected' : ''}>禁用</option></select>
    <div class="foot"><button onclick="closeModal()">取消</button><button class="primary" onclick="saveToken(${id || 0})">保存</button></div>
  `);
  if (t.expires_at) { const d = new Date(t.expires_at - new Date().getTimezoneOffset() * 60000); $('#t_exp').value = d.toISOString().slice(0, 16); }
}
async function saveToken(id) {
  const exp = $('#t_exp').value;
  const body = {
    name: $('#t_name').value.trim() || '未命名令牌',
    unlimited: $('#t_unl').value === '1',
    quota: Number($('#t_quota').value || 0),
    models: $('#t_models').value.split(/\r?\n/).map((s) => s.trim()).filter(Boolean),
    expires_at: exp ? new Date(exp).getTime() : 0,
    status: Number($('#t_status').value),
  };
  try {
    if (id) await api('/api/tokens/' + id, { method: 'PUT', body });
    else { const r = await api('/api/tokens', { method: 'POST', body }); toast('已创建：' + r.key, 'ok'); }
    closeModal(); viewTokens();
  } catch (e) { toast(e.message, 'bad'); }
}
async function resetToken(id) { await api('/api/tokens/' + id + '/reset', { method: 'POST' }); toast('已重置用量', 'ok'); viewTokens(); }
async function delToken(id) { if (!confirm('确定删除该令牌？')) return; await api('/api/tokens/' + id, { method: 'DELETE' }); toast('已删除', 'ok'); viewTokens(); }

/* ══════════════════════════════════════════════ 模型 */
async function viewModels() {
  M('<h2>模型列表</h2><div class="sub">加载中…</div>');
  const { rows, template, cooldowns } = await api('/api/models');
  M(`
  <h2>模型列表</h2>
  <div class="sub">所有渠道登记模型的并集；冷却中的模型会被自动跳过</div>
  <div class="cards">
    <div class="card"><div class="k">可用模型</div><div class="v">${rows.length}</div></div>
    <div class="card"><div class="k">冷却中</div><div class="v">${cooldowns.length}</div></div>
    <div class="card"><div class="k">请求体模板</div><div class="v">${(template.bytes / 1024).toFixed(0)}<small> KB</small></div></div>
    <div class="card"><div class="k">system + tools</div><div class="v">${fmtN(template.systemChars)}<small> 字符 / ${template.tools} 工具</small></div></div>
  </div>
  <div class="panel"><div class="tbl-wrap"><table>
    <thead><tr><th>模型 ID</th><th>来源</th><th>所属渠道</th><th>状态</th></tr></thead>
    <tbody>${rows.length ? rows.map((m) => `<tr>
      <td class="mono">${esc(m.id)}</td><td><span class="b dim">${esc(m.owned_by)}</span></td>
      <td>${m.channels.map((c) => `<span class="b ${c.status ? 'acc' : 'dim'}" style="margin-right:4px">${esc(c.name)}</span>`).join('')}</td>
      <td>${m.channels.some((c) => c.cooldown) ? '<span class="b warn">部分冷却</span>' : '<span class="b ok">就绪</span>'}</td>
    </tr>`).join('') : '<tr><td colspan="4" class="empty">还没有模型，请先添加渠道</td></tr>'}</tbody>
  </table></div></div>
  ${cooldowns.length ? `<div class="panel"><h3>冷却明细 <button class="sm" onclick="clearCd();viewModels()">全部解除</button></h3><div class="body">
    ${cooldowns.map((c) => `<span class="b warn" style="margin:3px">${esc(c.key)} · ${Math.round(c.leftMs / 60000)}m</span>`).join('')}</div></div>` : ''}
  `);
}

/* ══════════════════════════════════════════════ 日志 */
let LOGPAGE = 0;
async function viewLogs(page = 0) {
  LOGPAGE = page;
  M('<h2>请求日志</h2><div class="sub">加载中…</div>');
  const q = new URLSearchParams({ limit: 100, offset: page * 100 });
  const model = window.__logModel || '', okf = window.__logOk ?? '';
  if (model) q.set('model', model);
  if (okf !== '') q.set('ok', okf);
  const { rows, total } = await api('/api/logs?' + q);
  const pages = Math.ceil(total / 100);
  M(`
  <h2>请求日志</h2>
  <div class="sub">共 ${fmtN(total)} 条</div>
  <div class="toolbar">
    <input placeholder="按模型过滤" value="${esc(model)}" onchange="window.__logModel=this.value;viewLogs(0)">
    <select onchange="window.__logOk=this.value;viewLogs(0)">
      <option value="">全部结果</option>
      <option value="1"${okf === '1' ? ' selected' : ''}>仅成功</option>
      <option value="0"${okf === '0' ? ' selected' : ''}>仅失败</option>
    </select>
    <button onclick="viewLogs(${page})">刷新</button>
    <button class="danger" onclick="clearLogs()">清空日志</button>
  </div>
  <div class="panel"><div class="tbl-wrap"><table>
    <thead><tr><th>时间</th><th>令牌</th><th>渠道</th><th>模型</th><th>结果</th><th>TOKEN</th><th>延迟</th><th>代理</th></tr></thead>
    <tbody>${rows.length ? rows.map((l) => `<tr>
      <td style="font-size:12px">${fmtT(l.ts)}</td>
      <td>${esc(l.token_name || '-')}</td>
      <td>${esc(l.channel_name || '-')}</td>
      <td class="mono">${esc(l.model || '-')}${l.upstream_model && l.upstream_model !== l.model ? `<div style="font-size:11px;color:var(--dim)">→ ${esc(l.upstream_model)}</div>` : ''}</td>
      <td>${l.ok ? '<span class="b ok">200</span>' : `<span class="b bad">${l.status || 'ERR'}</span>`}${l.stream ? ' <span class="b dim">流</span>' : ''}</td>
      <td>${l.total_tokens ? fmtN(l.total_tokens) : '-'}</td>
      <td>${dur(l.latency_ms)}${l.ttft_ms ? `<div style="font-size:11px;color:var(--dim)">首字 ${dur(l.ttft_ms)}</div>` : ''}</td>
      <td class="mono" style="font-size:11px">${esc(l.proxy || '直连')}</td>
    </tr>${!l.ok && l.error ? `<tr><td colspan="8" style="color:var(--bad);font-size:11.5px;white-space:normal;padding-top:0">${esc(l.error.slice(0, 300))}</td></tr>` : ''}`).join('') : '<tr><td colspan="8" class="empty">暂无日志</td></tr>'}</tbody>
  </table></div></div>
  ${pages > 1 ? `<div class="toolbar" style="justify-content:center">
    <button ${page <= 0 ? 'disabled' : ''} onclick="viewLogs(${page - 1})">上一页</button>
    <span style="color:var(--dim)">第 ${page + 1} / ${pages} 页</span>
    <button ${page >= pages - 1 ? 'disabled' : ''} onclick="viewLogs(${page + 1})">下一页</button>
  </div>` : ''}`);
}
async function clearLogs() { if (!confirm('确定清空全部日志？')) return; await api('/api/logs', { method: 'DELETE' }); toast('已清空', 'ok'); viewLogs(0); }

/* ══════════════════════════════════════════════ 设置 */
async function viewSettings() {
  M('<h2>系统设置</h2><div class="sub">加载中…</div>');
  const [s, px] = await Promise.all([api('/api/settings'), api('/api/proxies')]);
  M(`
  <h2>系统设置</h2>
  <div class="sub">全局参数与安全</div>
  <div class="panel"><h3>基础</h3><div class="body">
    <label>站点名称</label><input id="s_name" value="${esc(s.site_name || '')}">
    <label>默认代理（渠道未单独设置时使用，可逗号分隔多节点）</label>
    <input id="s_proxy" class="mono" value="${esc(s.default_proxy || '')}" placeholder="http://127.0.0.1:7897,socks5://127.0.0.1:7897">
    <div style="margin-top:14px"><button class="primary" onclick="saveSettings()">保存</button></div>
  </div></div>

  <div class="panel"><h3>代理节点健康</h3><div class="tbl-wrap"><table>
    <thead><tr><th>节点</th><th>成功</th><th>失败</th><th>在途</th><th>状态</th><th>最近错误</th></tr></thead>
    <tbody>${px.rows.length ? px.rows.map((r) => `<tr>
      <td class="mono">${esc(r.url)}</td><td>${r.ok}</td><td>${r.fail}</td><td>${r.inflight}</td>
      <td>${r.down ? '<span class="b warn">冷却中</span>' : '<span class="b ok">正常</span>'}</td>
      <td class="wrap" style="font-size:11px;color:var(--dim)">${esc(r.lastError || '-')}</td>
    </tr>`).join('') : '<tr><td colspan="6" class="empty">未配置代理，全部走直连</td></tr>'}</tbody>
  </table></div></div>

  <div class="panel"><h3>请求体模板</h3><div class="body">
    <div style="color:var(--dim);font-size:12px">免费层要求携带完整 agent 结构请求体，模板位于 <span class="mono">body_template.json</span>，修改后重启生效。</div>
    <pre>${esc(JSON.stringify(s.template, null, 2))}</pre>
  </div></div>

  <div class="panel"><h3>修改管理密码</h3><div class="body">
    <label>原密码</label><input id="p_old" type="password">
    <label>新密码（至少 6 位）</label><input id="p_new" type="password">
    <div style="margin-top:14px"><button class="primary" onclick="savePw()">修改密码</button></div>
  </div></div>`);
}
async function saveSettings() {
  try { await api('/api/settings', { method: 'POST', body: { site_name: $('#s_name').value, default_proxy: $('#s_proxy').value } }); toast('已保存', 'ok'); $('#brandName').textContent = $('#s_name').value; }
  catch (e) { toast(e.message, 'bad'); }
}
async function savePw() {
  try { await api('/api/password', { method: 'POST', body: { old: $('#p_old').value, new: $('#p_new').value } }); toast('密码已修改', 'ok'); $('#p_old').value = $('#p_new').value = ''; }
  catch (e) { toast(e.message, 'bad'); }
}

/* ══════════════════════════════════════════════ 通用 */
function openModal(html) { $('#modal').innerHTML = `<div class="box">${html}</div>`; $('#modal').classList.remove('hidden'); }
function closeModal() { $('#modal').classList.add('hidden'); $('#modal').innerHTML = ''; }
function copy(t) { navigator.clipboard.writeText(t).then(() => toast('已复制', 'ok'), () => toast('复制失败', 'bad')); }

boot();
</script>
</body>
</html>
